red_flags:
  - no company website
  - Telegram interview
  - WhatsApp interview
  - asks candidate to buy equipment
  - asks candidate to deposit a check
  - vague company
  - high pay plus no experience
  - no product or service described
  - commission-only support role
search_terms:
  - Remote Help Desk Analyst I
  - Remote Service Desk Analyst I
  - Remote Level 1 IT Technician
  - Remote Technical Support Specialist I
  - Remote IT Support Specialist Entry Level
bullet_templates:
  - "Troubleshot technical workflow issues across {project_or_context}, isolating root causes and documenting repeatable fixes."
  - "Created validation and recovery steps to prevent failed automation runs from silently producing broken outputs."
  - "Used Python, Linux, and command-line tools to debug file, API, media, and deployment issues."
  - "Documented technical processes clearly so repeated issues could be resolved faster."
answer_angles:
  why_interested:
    - "I am interested in this role because it combines technical troubleshooting, clear communication, and structured problem solving."
  weakness_bridge:
    - "While I do not have formal corporate help desk experience, I have built and debugged real software workflows and can translate technical issues into clear steps."
